name: Build guidelines (Word and PDF)

# Regenerates docs/guidelines.docx and docs/guidelines.pdf from docs/guidelines.md.
# main only accepts pull requests, so the files are rebuilt in the pull request that changes
# the guidelines and committed to its branch; they are then merged together with the change.

on:
  pull_request:
    paths:
      - docs/guidelines.md
      - docs/img/**
      - scripts/build-guidelines-docx.py
      - .github/workflows/build-guidelines.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-guidelines-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-guidelines:
    # Pull requests from forks cannot receive commits from this workflow.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The branch itself rather than the temporary merge commit, so the
          # documents link to a commit that exists and the result can be pushed.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pandoc, LibreOffice and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc libreoffice-writer \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build Word and PDF versions
        run: uv run python scripts/build-guidelines-docx.py --pdf

      - name: Upload documents
        uses: actions/upload-artifact@v4
        with:
          name: guidelines
          path: |
            docs/guidelines.docx
            docs/guidelines.pdf

      - name: Commit and push regenerated documents
        # main is protected; a manual run there only produces the artifact above.
        if: github.head_ref != '' || github.ref_name != github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/guidelines.docx docs/guidelines.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate Word and PDF guidelines [skip ci]"
            git push
          fi
